name: 🎵 Spotify & SoundCloud Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'عملیات'
        required: true
        type: choice
        options:
          - download
          - delete-all
      url:
        description: 'لینک اسپاتیفای، ساندکلود (یا خالی بگذارید)'
        required: false
        type: string
      search_query:
        description: 'اسم آهنگ + خواننده (برای جستجوی خودکار)'
        required: false
        type: string
      output_format:
        description: 'فرمت خروجی'
        required: false
        default: 'mp3'
        type: choice
        options:
          - mp3
          - flac
      save_in_new_branch:
        description: 'ذخیره در یک شاخهٔ جدید'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ========== کش & WARP (فقط برای دانلود) ==========
      - name: Cache WARP image
        if: github.event.inputs.action == 'download'
        id: cache-warp
        uses: actions/cache@v4
        with:
          path: warp-image.tar
          key: warp-image-${{ runner.os }}-v1

      - name: Load or pull WARP
        if: github.event.inputs.action == 'download'
        run: |
          if [ -f warp-image.tar ]; then
            docker load < warp-image.tar
          else
            docker pull caomingjun/warp
            docker save caomingjun/warp -o warp-image.tar
          fi

      - name: Start WARP
        if: github.event.inputs.action == 'download'
        run: |
          docker network create warp-net || true
          docker run -d --name warp --restart=always --network warp-net \
            -p 1080:1080 --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp caomingjun/warp
          for i in {1..30}; do sleep 1
            curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace | grep -q "warp=on" && break
          done
          echo "WARP ready."

      - name: Cache apt packages
        if: github.event.inputs.action == 'download'
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-packages-${{ runner.os }}-v1

      - name: Install system dependencies
        if: github.event.inputs.action == 'download'
        run: |
          if [ -d ~/apt-cache ]; then
            sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip curl python3-pip
          mkdir -p ~/apt-cache
          sudo cp /var/cache/apt/archives/*.deb ~/apt-cache/
          sudo chmod 644 ~/apt-cache/*.deb

      - name: Cache pip
        if: github.event.inputs.action == 'download'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-spot-v1
          restore-keys: |
            pip-${{ runner.os }}-spot-

      - name: Install Python tools
        if: github.event.inputs.action == 'download'
        run: |
          pip3 install --upgrade yt-dlp spotdl

      # ========== دانلود ==========
      - name: Download audio
        if: github.event.inputs.action == 'download'
        run: |
          URL="${{ github.event.inputs.url }}"
          SEARCH="${{ github.event.inputs.search_query }}"
          FORMAT="${{ github.event.inputs.output_format }}"
          mkdir -p music tmp_music

          # اگر search_query پر شده باشد، آن را به جستجوی یوتیوب تبدیل کن
          if [ -n "$SEARCH" ]; then
            echo "🔍 Searching for: $SEARCH"
            # جستجوی یوتیوب: اولین نتیجه را بگیر
            DOWNLOAD_URL="ytsearch1:${SEARCH}"
            yt-dlp \
              --proxy "socks5://127.0.0.1:1080" \
              -x --audio-format "$FORMAT" --audio-quality 0 \
              -o "tmp_music/%(title)s.%(ext)s" \
              "$DOWNLOAD_URL" || {
                yt-dlp -x --audio-format "$FORMAT" -o "tmp_music/%(title)s.%(ext)s" "$DOWNLOAD_URL"
              }
          elif echo "$URL" | grep -q 'spotify\.com'; then
            echo "🎵 Spotify URL detected"
            spotdl "$URL" \
              --output "tmp_music/" \
              --format "$FORMAT" \
              --bitrate 320k \
              --proxy "socks5://127.0.0.1:1080" || {
                spotdl "$URL" --output "tmp_music/" --format "$FORMAT" --bitrate 320k
              }
          else
            echo "☁️ SoundCloud or other URL"
            yt-dlp \
              --proxy "socks5://127.0.0.1:1080" \
              -x --audio-format "$FORMAT" --audio-quality 0 \
              -o "tmp_music/%(title)s.%(ext)s" \
              "$URL" || {
                yt-dlp -x --audio-format "$FORMAT" -o "tmp_music/%(title)s.%(ext)s" "$URL"
              }
          fi

          # انتقال و پارتی‌بندی
          for FILE in tmp_music/*; do
            [ -f "$FILE" ] || continue
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            if [ "$SIZE" -gt $(( 90 * 1024 * 1024 )) ]; then
              zip -0 -s 90m "music/${BASENAME}.zip" -j "$FILE"
            else
              cp "$FILE" "music/$BASENAME"
            fi
          done
          rm -rf tmp_music

      # ========== حذف همه ==========
      - name: Delete all music
        if: github.event.inputs.action == 'delete-all'
        run: |
          if [ -d "music" ] && [ "$(ls -A music 2>/dev/null)" ]; then
            git rm -rf music/* 2>/dev/null || true
            echo "🗑️ All music files marked for deletion."
          else
            echo "📂 music folder already empty."
          fi

      # ========== README ==========
      - name: Generate README
        if: github.event.inputs.action == 'download'
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BASE_URL="https://github.com/${REPO}/raw/${BRANCH}/music"
          {
            echo "# 🎵 Downloaded Music"
            for FILE in music/*; do
              [ -f "$FILE" ] || continue
              BASENAME=$(basename "$FILE")
              ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$BASENAME'''))")
              echo "- [${BASENAME}](${BASE_URL}/${ENCODED})"
            done
            echo ""
            echo "*Downloaded on: $(date)*"
          } > music/README.md

      # ========== Commit & Push ==========
      - name: Commit and push changes
        if: always()
        run: |
          SAVE="${{ github.event.inputs.save_in_new_branch }}"
          if [ "$SAVE" == "true" ]; then
            BRANCH="music-$(date +%Y%m%d-%H%M%S)-$(echo $RANDOM | md5sum | head -c 6)"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f music/
          if git diff --cached --quiet && git diff --quiet; then
            echo "No changes."
          else
            git commit -m "Music – ${{ github.event.inputs.action }} [skip ci]"
            git pull --rebase origin "$BRANCH" || true
            git push origin HEAD:"$BRANCH"
          fi
